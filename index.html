<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Canvas MVP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo">CC</div>
        <nav>
          <button class="nav-item active">Campaign Canvas</button>
          <button class="nav-item">Content Workspace</button>
          <button class="nav-item">AI Brain</button>
          <button class="nav-item">Insights</button>
        </nav>
      </aside>

      <main class="workspace-wrap">
        <header class="topbar">
          <div>
            <h1>Campaign Canvas — Blank Space</h1>
            <p>Starte ohne Inhalte und baue Nodes gemeinsam auf.</p>
          </div>
          <div class="actions">
            <button id="add-node-btn">+ Add node</button>
            <button>AI Assistant</button>
            <button class="primary">Share</button>
          </div>
        </header>

        <section class="canvas" id="canvas">
          <svg class="links" id="links" aria-hidden="true"></svg>
          <div class="empty-state" id="empty-state">
            Noch keine Nodes vorhanden. Klicke auf <strong>+ Add node</strong>, um zu starten.
          </div>
        </section>
      </main>

      <aside class="inspector">
        <h2>Node Konfiguration</h2>
        <div class="meta" id="inspector-meta">Wähle oder erstelle einen Node.</div>

        <form id="node-form" class="node-form" autocomplete="off">
          <label for="node-type">Typ</label>
          <input id="node-type" name="type" placeholder="z. B. Idea, Angle, Ad" />

          <label for="node-title">Titel</label>
          <input id="node-title" name="title" placeholder="Node Titel" />

          <label for="node-content">Inhalt</label>
          <textarea id="node-content" name="content" rows="4" placeholder="Beschreibung, Prompt, Task ..."></textarea>

          <label for="node-tags">Tags (Komma getrennt)</label>
          <input id="node-tags" name="tags" placeholder="Audience, Goal, Channel" />

          <label for="node-variants">A/B Varianten (Komma getrennt)</label>
          <input id="node-variants" name="variants" placeholder="A: Hook 1, B: Hook 2" />

          <button id="delete-node-btn" type="button" class="danger">Delete node</button>
        </form>
      </aside>
    </div>

    <template id="node-template">
      <article class="node" tabindex="0">
        <div class="drag-handle" title="Drag node">⋮⋮</div>
        <span class="type"></span>
        <h3 class="title" contenteditable="true"></h3>
        <p class="content" contenteditable="true"></p>
        <div class="tags"></div>
        <div class="ab-tests"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
