<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">Proposed Home composition: desktop and mobile</title><desc id="desc">Annotated wireframes with field placeholders only. Compact context and factual next moves precede saved Boards. Selected Brand intelligence stays separate from current Board intelligence. Full Brand exploration follows. Mobile reserves room above existing fixed navigation.</desc>
