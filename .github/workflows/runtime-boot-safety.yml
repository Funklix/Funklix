name: Runtime Boot Safety

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-boot-safety:
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17.6", "18.4"]
    runs-on: ubuntu-latest
    services:
      brand-knowledge-postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: bw23_fixture_admin
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: disposable-bw36-23-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bw23_fixture_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check strict PostgreSQL TLS configuration
        run: npm run check:postgres-tls
      - name: Prepare non-bootstrap postgres test operator
        # PostgreSQL forbids demoting the bootstrap superuser. A distinct fixture
        # admin lets the R3 suite model Supabase's NOSUPERUSER postgres safely.
        run: |
          node - <<'JS'
          const {Client}=require('pg');
          (async()=>{
            const c=new Client({connectionString:'postgres://bw23_fixture_admin:disposable-bw36-23-fixture@127.0.0.1:5432/postgres'});
            await c.connect();
            try {await c.query("CREATE ROLE postgres LOGIN SUPERUSER PASSWORD 'disposable-bw36-23-fixture'");}
            finally {await c.end();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
