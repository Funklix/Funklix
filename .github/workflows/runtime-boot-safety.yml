      - name: Install focused browser fixture
        timeout-minutes: 5
        run: |
          # Hosted Ubuntu already supplies browser libraries. Avoid apt repository
          # retries; retain Chromium matched to the installed Playwright version.
          npx playwright-core install chromium
          node - <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const executablePath = chromium.executablePath();
            const browser = await chromium.launch({ executablePath, args: ['--no-sandbox'], timeout: 30000 });
            try {
              const page = await browser.newPage();
              await page.setContent('<title>Runtime Boot Safety browser ready</title>');
              if (await page.title() !== 'Runtime Boot Safety browser ready') throw new Error('Browser smoke check failed');
              console.log(`Verified Chromium ${browser.version()} at ${executablePath}`);
            } finally { await browser.close(); }
            fs.appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${executablePath}\n`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
