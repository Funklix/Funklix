name: Runtime Boot Safety

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-boot-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check runtime script syntax
        run: |
          node --check knowledge-module-registry.js
          node --check knowledge-module-identity.js
          node --check knowledge-module-runtime-adapter.js
          node --check app.js
          node --check campaign-v3.js
      - name: Check browser script integrity
        run: node scripts/check-browser-script-integrity.js
      - name: Check read-only Canonical Brand catalog
        run: node scripts/check-bw1-brand-catalog.js
      - name: Check ephemeral Canonical Brand selection
        run: node scripts/check-bw2-ephemeral-brand-selection.js
      - name: Check Canonical Brand creation
        run: node scripts/check-bw3-canonical-brand-creation.js
      - name: Check durable Workspace Brand selection
        run: node scripts/check-bw4-durable-brand-selection.js
      - name: Check explicit Board Brand association
        run: node scripts/check-bw5-board-brand-association.js
      - name: Check per-Board Brand association isolation
        run: node scripts/check-bw5-board-brand-isolation-regression.js
      - name: Check Board Brand catalog resolution states
        run: node scripts/check-bw5-board-brand-resolution-state.js
      - name: Check read-only Canonical Brand Workspace detail
        run: node scripts/check-bw6-brand-workspace-detail.js
      - name: Check explicit Canonical Brand editing
        run: node scripts/check-bw7-canonical-brand-editing.js
      - name: Check read-only Brand Core comparison
        run: node scripts/check-bw8-brand-core-comparison.js
      - name: Check Brand Core comparison lifecycle
        run: node scripts/check-bw8-brand-core-comparison-lifecycle.js
      - name: Check explicit Canonical Brand Core initialization
        run: node scripts/check-bw9-initialize-canonical-brand-core.js
      - name: Check Brand-scoped Board library
        run: node scripts/check-bw10-brand-scoped-board-library.js
      - name: Check explicit Board creation from Canonical Brand
        run: node scripts/check-bw11-create-board-from-canonical-brand.js
      - name: Check Canonical Brand snapshot provenance
        run: node scripts/check-bw12-canonical-snapshot-provenance.js
      - name: Check controlled Canonical-to-Board refresh
        run: node scripts/check-bw13-canonical-to-board-refresh.js
      - name: Check Canonical Brand foundation contracts
        run: node scripts/check-canonical-brand-foundation.js
      - name: Check sanitized read-only database inspector
        run: node scripts/check-bw15-read-only-db-inspector.js
      - name: Check timing-safe session signature verification
        run: node scripts/check-bw16-timing-safe-session-verification.js
      - name: Check Knowledge Module browser globals
        run: node scripts/check-knowledge-module-browser-globals.js
